<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camila Assis Tavares — Published Articles</title>
  <meta name="description" content="Published articles in computational chemistry: molecular dynamics, force fields and inverse problems.">
  <link rel="icon" type="image/png" href="logo/logo-black.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="pular" href="#lista">Skip to articles</a>

  <header class="topo">
    <div class="topo-interno">
      <div class="topo-cabeca">
        <div class="marca" aria-hidden="true">
          <img class="marca-clara" src="logo/logo-black.svg" alt="" width="52" height="52">
          <img class="marca-escura" src="logo/logo-white.svg" alt="" width="52" height="52">
        </div>
        <h1 id="nome"></h1>
      </div>
      <div class="topo-acento" aria-hidden="true"></div>
      <ul class="resumo" id="resumo"></ul>
      <div class="topo-rodape">
        <p class="numeros" id="numeros"></p>
        <p class="links" id="links"></p>
      </div>
    </div>
  </header>

  <div class="pagina">
    <nav class="regua" aria-label="Timeline">
      <ol id="regua"></ol>
    </nav>

    <main>
      <section class="controles" aria-label="Filters">
        <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
        <label class="busca">
          <span>Search by title, journal or co-author</span>
          <input type="search" id="busca" autocomplete="off">
        </label>
        <p class="contagem" id="contagem" role="status" aria-live="polite"></p>
      </section>

      <div id="lista"></div>
    </main>
  </div>

  <footer class="rodape">
    <p id="rodape"></p>
  </footer>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="data/artigos.js"></script>
  <script src="app.js"></script>
</body>
</html>
