<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Camila Assis Tavares</title>

  <meta
    name="description"
    content="Publicações de Camila Assis Tavares."
  >

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231E3A8A'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Averia -->
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="pular" href="#lista">Pular para os artigos</a>

  <header class="topo">
    <div class="topo-interno">

      <div class="topo-cabeca">
        <h1 id="nome"></h1>
      </div>

      <ul class="resumo" id="resumo"></ul>

      <div class="topo-rodape">
        <p class="numeros" id="numeros"></p>
        <p class="links" id="links"></p>
      </div>

    </div>
  </header>

  <div class="pagina">

    <nav class="regua" aria-label="Linha do tempo">
      <ol id="regua"></ol>
    </nav>

    <main>

      <section class="controles" aria-label="Filtros">

        <div
          class="chips"
          id="chips"
          role="group"
          aria-label="Filtrar por tema"
        ></div>

        <label class="busca">
          <span>Buscar por título, revista ou coautor</span>
          <input
            type="search"
            id="busca"
            autocomplete="off"
          >
        </label>

        <p
          class="contagem"
          id="contagem"
          role="status"
          aria-live="polite"
        ></p>

      </section>

      <div id="lista"></div>

    </main>

  </div>

  <footer class="rodape">
    <p id="rodape"></p>
  </footer>

  <div
    class="aviso"
    id="aviso"
    role="status"
    aria-live="polite"
  ></div>

  <script src="data/artigos.js"></script>
  <script src="app.js"></script>

</body>
</html>
