<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camila Assis Tavares — Published Articles</title>
  <meta name="description" content="Published articles in computational chemistry: molecular dynamics, force fields and inverse problems.">
  <link rel="icon" type="image/svg+xml" href="logo/logo-black.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="pular" href="#sobre">Skip to content</a>

  <nav class="menu-topo" aria-label="Section navigation">
    <ol id="menu-secoes">
      <li data-secao="sobre"><a href="#sobre">About me</a></li>
      <li data-secao="publicacoes"><a href="#publicacoes">Publications</a></li>
      <li data-secao="ilustracoes"><a href="#ilustracoes">Scientific Illustration</a></li>
      <li data-secao="ferramentas"><a href="#ferramentas">Software</a></li>
      <li data-secao="ensino"><a href="#ensino">Teaching</a></li>
      <li data-secao="contato"><a href="#contato">Contact me</a></li>
    </ol>
  </nav>

  <header class="topo">
    <div class="topo-interno">
      <div class="topo-cabeca">
        <div class="marca" aria-hidden="true">
          <img class="marca-clara" src="logo/logo-black.svg" alt="">
          <img class="marca-escura" src="logo/logo-white.svg" alt="">
        </div>
        <h1 id="nome"></h1>
      </div>
      <div class="topo-acento" aria-hidden="true"></div>
      <ul class="resumo" id="resumo"></ul>
      <p class="situacao" id="situacao"></p>
    </div>
  </header>

  <div class="pagina">
    <main>
      <section class="secao secao-sobre" id="sobre">
        <div class="sobre-grid">
          <h2 class="secao-titulo">About me</h2>
          <div class="sobre-corpo">
            <p class="bio" id="bio"></p>
            <p class="links" id="links"></p>
          </div>
          <figure class="sobre-foto" id="sobre-foto" hidden>
            <img id="sobre-foto-img" alt="">
          </figure>
        </div>
      </section>

      <section class="secao secao-publicacoes" id="publicacoes">
        <h2 class="secao-titulo">Publications</h2>
        <p class="numeros" id="numeros"></p>

        <div class="publicacoes-corpo">
          <nav class="regua" aria-label="Jump to year">
            <ol id="regua"></ol>
          </nav>

          <div class="publicacoes-conteudo">
            <div class="controles" aria-label="Filters">
              <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
              <label class="busca">
                <span>Search by title, journal or co-author</span>
                <input type="search" id="busca" autocomplete="off">
              </label>
              <p class="contagem" id="contagem" role="status" aria-live="polite"></p>
            </div>

            <div id="lista"></div>
          </div>
        </div>
      </section>

      <section class="secao secao-ilustracoes" id="ilustracoes">
        <h2 class="secao-titulo">Scientific Illustration</h2>
        <p class="numeros" id="ilustracoes-numeros"></p>
        <div class="ilustracoes-grade" id="ilustracoes-grade"></div>
      </section>

      <section class="secao secao-ferramentas" id="ferramentas">
        <h2 class="secao-titulo">Software</h2>
        <div class="ferramentas-grade" id="ferramentas-grade"></div>
      </section>

      <section class="secao secao-ensino" id="ensino">
        <h2 class="secao-titulo">Teaching</h2>
        <div class="ferramentas-grade" id="ensino-grade"></div>
      </section>

      <section class="secao secao-contato" id="contato">
        <div class="contato-grid">
          <h2 class="secao-titulo">Contact me</h2>
          <ul class="contato-lista" id="contato-lista"></ul>
          <svg class="contato-arte" id="contato-arte" viewBox="5 9 288 192" preserveAspectRatio="xMaxYMid meet" aria-hidden="true" focusable="false">
            <path id="contato-forma" fill="currentColor"/>
          </svg>
        </div>
      </section>
    </main>
  </div>

  <footer class="rodape">
    <p id="rodape"></p>
  </footer>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-fechar" id="lightbox-fechar" aria-label="Close">&times;</button>
    <figure class="lightbox-imagem">
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-legenda"></figcaption>
    </figure>
  </div>

  <script src="data/artigos.js"></script>
    <script src="app.js"></script>
  <script src="data/contato-frames.js"></script>
  <script src="contato-anim.js"></script>
</body>
</html>
